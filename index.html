<!doctype html>

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => {
          console.warn("Falha ao registrar service worker:", e);
        });
      });
    }
  </script>
